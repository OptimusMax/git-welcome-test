[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dubber"
version = "0.1.0"
description = "Автоматичний дубляж відео: розпізнавання мови, переклад, синтез голосу та зведення"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "faster-whisper>=1.0",
    "deep-translator>=1.11",
    "edge-tts>=6.1",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dubber = "dubber.cli:main"

[tool.setuptools]
packages = ["dubber"]
